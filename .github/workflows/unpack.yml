name: unpack
on: workflow_dispatch
permissions:
  contents: write
jobs:
  u:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o code.zip
          rm code.zip
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add -A
          git commit -m "Add extraction engine code"
          git push
