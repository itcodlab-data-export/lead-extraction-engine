name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Full test suite (offline, safety locks, repo rules)
        run: python -m pytest -q tests
      - name: PR rules (STATE.md + CHANGELOG.md updated, append-only, protected files)
        if: github.event_name == 'pull_request'
        run: python tools/check_pr_rules.py "origin/${{ github.base_ref }}"
