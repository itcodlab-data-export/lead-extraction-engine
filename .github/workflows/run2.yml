name: run_leads2
on:
  schedule:
  - cron: "17 */3 * * *"   # every 3 hours (8 runs/day, UTC)
  workflow_dispatch:
    inputs:
      target_country:
        description: target country
        type: choice
        options: [BOTH, US, INDIA]
        default: BOTH
concurrency:
  group: run-leads2
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: CI gate (offline + safety tests)
        run: pip install pytest && python -m pytest -q tests/test_offline.py tests/test_safety_locks.py
      - name: Extract
        env:
          TARGET_COUNTRY: ${{ inputs.target_country || 'BOTH' }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PRODUCTHUNT_TOKEN: ${{ secrets.PRODUCTHUNT_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          API_KEYS: ${{ secrets.API_KEYS }}
        run: python main.py
      - name: Keep-alive
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( ( $(date +%s) - last ) / 86400 )) -ge 45 ]; then
            date -u +%F > .heartbeat
            git config user.name bot; git config user.email bot@users.noreply.github.com
            git add .heartbeat; git commit -m heartbeat; git push
          fi
