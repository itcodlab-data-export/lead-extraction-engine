name: daily_leads
on:
  schedule:
    - cron: "30 0 * * *"   # 06:00 AM IST
  workflow_dispatch:
    inputs:
      target_country:
        description: Country
        type: choice
        options: [BOTH, US, INDIA]
        default: BOTH
concurrency:
  group: daily-leads
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Extract
        env:
          TARGET_COUNTRY: ${{ github.event.inputs.target_country || 'BOTH' }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
      - name: Keep-alive (prevents 60-day cron pause)
        run: |
          last=$(git log -1 --format=%ct); now=$(date +%s)
          if [ $(( (now-last)/86400 )) -ge 45 ]; then
            date -u > .heartbeat
            git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
            git add .heartbeat; git commit -m "heartbeat"; git push
          fi
